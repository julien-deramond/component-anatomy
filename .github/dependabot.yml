version: 2
updates:
  - package-ecosystem: 'npm'
    # One entry for the whole pnpm workspace: a directory listed in its own entry can't
    # update the root pnpm-lock.yaml, so its PRs fail CI. Add new examples here explicitly.
    directories:
      - '/'
      - '/packages/*'
      - '/examples/astro'
      - '/examples/plain-html'
      - '/examples/sandbox'
      - '/examples/storybook'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      github-actions:
        patterns:
          - '*'
    ignore:
      # `astro check` (@astrojs/check) in examples/astro needs the TypeScript programmatic API,
      # which the native TypeScript 7 compiler doesn't ship yet.
      # Track https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: 'typescript'
        versions: ['>=7']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      github-actions:
        patterns:
          - '*'
